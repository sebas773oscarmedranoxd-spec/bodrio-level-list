<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bodrio Level List (BLL)</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- HEADER / NAVBAR -->
    <header class="navbar">
        <div class="logo-container">
            <h1 class="logo-title">BLL</h1>
            <span class="logo-subtitle">Bodrio Level List</span>
        </div>
        <nav class="nav-tabs">
            <button class="nav-tab active" data-tab="main">Main (Top 1-100)</button>
            <button class="nav-tab" data-tab="extended">Extended</button>
            <button class="nav-tab" data-tab="legacy">Legacy</button>
            <button class="nav-tab" data-tab="hot">HOT</button>
            <button class="nav-tab" data-tab="top-players">Top Players</button>
            <button class="nav-tab" data-tab="verifiers">Verifiers</button>
            <button class="nav-tab" data-tab="decorators">Decorators</button>
        </nav>
        <button id="open-admin-btn" class="btn-admin">🔒 Admin</button>
    </header>

    <!-- MAIN CONTENT AREA -->
    <main class="main-layout">
        <!-- LEFT COLUMN (LIST) -->
        <section class="content-section">
            <h2 id="section-title" class="section-title">Main List (Top 1-100)</h2>
            <div id="list-container" class="list-container">
                <!-- Content generated dynamically by JS -->
            </div>
        </section>

        <!-- RIGHT COLUMN (DETAILS SIDEBAR) -->
        <aside id="details-sidebar" class="details-sidebar">
            <div id="detail-card" class="detail-card">
                <p class="select-prompt">Selecciona un elemento de la lista para ver sus detalles.</p>
            </div>
        </aside>
    </main>

    <!-- ADMIN MODAL -->
    <div id="admin-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <button id="close-admin-btn" class="modal-close">&times;</button>
            
            <!-- AUTH VIEW -->
            <div id="admin-auth-view" class="admin-view">
                <h2>Panel de Administración BLL</h2>
                <p>Ingresa la contraseña para añadir/editar elementos:</p>
                <form id="admin-login-form">
                    <input type="password" id="admin-pass-input" placeholder="Contraseña de Admin" required autocomplete="current-password">
                    <button type="submit" class="btn-submit">Entrar</button>
                </form>
            </div>

            <!-- DASHBOARD VIEW -->
            <div id="admin-dash-view" class="admin-view hidden">
                <div class="dash-header">
                    <h2>Panel de Control Admin</h2>
                    <button id="admin-logout-btn" class="btn-secondary">Cerrar Sesión</button>
                </div>
                <div id="admin-content-area" class="admin-content-area">
                    <!-- Dynamic admin forms inserted by JS based on current active tab -->
                </div>
            </div>
        </div>
    </div>

    <!-- Librería oficial de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
